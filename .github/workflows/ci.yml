name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SITE_ENV: production
  NEXT_PUBLIC_SITE_URL: https://thegildedskin.com
  AMAZON_ASSOCIATE_TAG: gettse00-20
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:content
      - run: npm run audit:links
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
